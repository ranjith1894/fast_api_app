<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Vote</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: rgba(255,255,255,0.07);
    --text: #f0f0f5;
    --muted: #5a5a72;
    --accent: #c8f060;

    --python: #4fa8d5;
    --java:   #f89820;
    --go:     #00acd7;
    --rust:   #e05d2c;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
    color: var(--text);
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,240,96,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,240,96,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(200,240,96,0.06) 0%, transparent 70%);
    top: -200px;
    right: -200px;
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 32px 80px rgba(0,0,0,0.6);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .header { margin-bottom: 2rem; }

  .tag {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
  }

  .vote-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .vote-btn {
    all: unset;
    cursor: pointer;
    border-radius: 12px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .vote-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--lang-color);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .vote-btn:hover { transform: translateY(-2px); }
  .vote-btn:hover::before { opacity: 0.08; }
  .vote-btn:hover { border-color: var(--lang-color); box-shadow: 0 0 0 1px var(--lang-color); }
  .vote-btn:active { transform: translateY(0); }

  .vote-btn.voted {
    border-color: var(--lang-color);
    box-shadow: 0 0 20px color-mix(in srgb, var(--lang-color) 25%, transparent);
  }
  .vote-btn.voted::before { opacity: 0.1; }

  .btn-emoji { font-size: 1.6rem; line-height: 1; position: relative; }

  .btn-label {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
    position: relative;
    letter-spacing: -0.01em;
  }

  .btn-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    position: relative;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .results { display: flex; flex-direction: column; gap: 0.85rem; }
  .result-row { display: flex; flex-direction: column; gap: 0.35rem; }

  .result-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .result-name {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .result-name .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--lang-color);
    display: inline-block;
    flex-shrink: 0;
  }

  .result-count { font-size: 11px; color: var(--muted); }

  .bar-track {
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--lang-color);
    width: 0%;
    transition: width 0.6s cubic-bezier(0.16,1,0.3,1);
    position: relative;
  }

  .bar-fill::after {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 20px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
    border-radius: 99px;
  }

  .result-pct {
    font-size: 10px;
    color: var(--muted);
    text-align: right;
    letter-spacing: 0.04em;
  }

  .footer {
    margin-top: 2rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-total { font-size: 11px; color: var(--muted); }
  .footer-total strong {
    color: var(--accent);
    font-family: 'Syne', sans-serif;
  }

  .footer-badge {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(200,240,96,0.2);
    padding: 3px 8px;
    border-radius: 99px;
  }

  .live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse 2s infinite;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="tag">// community poll</div>
    <h1>What's your<br>favorite <span>language?</span></h1>
    <p class="subtitle">Cast your vote · results update live</p>
  </div>

  <div class="vote-grid">
    <button class="vote-btn" onclick="vote('Python')" id="btn-Python" style="--lang-color: var(--python)">
      <span class="btn-emoji">🐍</span>
      <span class="btn-label">Python</span>
      <span class="btn-sub">General purpose</span>
    </button>
    <button class="vote-btn" onclick="vote('Java')" id="btn-Java" style="--lang-color: var(--java)">
      <span class="btn-emoji">☕</span>
      <span class="btn-label">Java</span>
      <span class="btn-sub">Enterprise scale</span>
    </button>
    <button class="vote-btn" onclick="vote('Go')" id="btn-Go" style="--lang-color: var(--go)">
      <span class="btn-emoji">🚀</span>
      <span class="btn-label">Go</span>
      <span class="btn-sub">Cloud native</span>
    </button>
    <button class="vote-btn" onclick="vote('Rust')" id="btn-Rust" style="--lang-color: var(--rust)">
      <span class="btn-emoji">🦀</span>
      <span class="btn-label">Rust</span>
      <span class="btn-sub">Systems speed</span>
    </button>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-text"><span class="live-dot"></span>Live Results</div>
    <div class="divider-line"></div>
  </div>

  <div class="results" id="results"></div>

  <div class="footer">
    <div class="footer-total">Total: <strong id="total-count">0</strong> votes</div>
    <div class="footer-badge">Open poll</div>
  </div>
</div>

<script>
  const colors = {
    Python: 'var(--python)',
    Java:   'var(--java)',
    Go:     'var(--go)',
    Rust:   'var(--rust)',
  };

  // In-memory votes (wire up to your /vote and /results endpoints)
  let votes = { Python: 0, Java: 0, Go: 0, Rust: 0 };
  let lastVoted = null;

  async function vote(lang) {
    if (lastVoted) document.getElementById('btn-' + lastVoted)?.classList.remove('voted');
    votes[lang]++;
    lastVoted = lang;
    document.getElementById('btn-' + lang)?.classList.add('voted');

    // Uncomment for real backend:
    // await fetch("/vote/" + lang, { method: "POST" });
    // const data = await (await fetch("/results")).json();
    // renderResults(data);

    renderResults(votes);
  }

  function renderResults(data) {
    const total = Object.values(data).reduce((a, b) => a + b, 0);
    document.getElementById('total-count').textContent = total;

    const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
    let html = '';
    for (const [lang, count] of sorted) {
      const pct = total ? ((count / total) * 100).toFixed(1) : '0.0';
      html += `
        <div class="result-row">
          <div class="result-meta">
            <div class="result-name" style="--lang-color:${colors[lang]}">
              <span class="dot"></span>${lang}
            </div>
            <div class="result-count">${count} vote${count !== 1 ? 's' : ''}</div>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="--lang-color:${colors[lang]}; width:${pct}%"></div>
          </div>
          <div class="result-pct">${pct}%</div>
        </div>`;
    }
    document.getElementById('results').innerHTML = html;
  }

  renderResults(votes);
</script>
</body>
</html>
